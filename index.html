<!DOCTYPE html><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b12">

  <title>ꯑꯩꯒꯤ ꯊꯋꯥꯏ 𖹭</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      background: radial-gradient(
        ellipse at top,
        #19243a 0%,
        #080b12 65%
      );
      color: #e8edf7;
      font-family: "Courier New", monospace;
    }

    .screen {
      width: 100%;
      max-width: 650px;
      padding: 28px 22px;
      border: 1px solid #29354a;
      border-radius: 16px;
      background: rgba(14, 20, 32, 0.96);
      box-shadow: 0 15px 60px #0008;
      animation: appear 1s ease;
    }

    .status {
      color: #94a3b8;
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 28px;
    }

    .dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #83d8ad;
      margin-right: 8px;
      box-shadow: 0 0 9px #83d8ad66;
    }

    #output {
      min-height: 190px;
      font-size: clamp(15px, 4vw, 20px);
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .cursor {
      display: inline-block;
      width: 8px;
      height: 1.05em;
      background: #e4eaff;
      vertical-align: -3px;
      animation: blink 0.8s steps(2, start) infinite;
    }

    button {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      color: #edf2ff;
      background: #202d43;
      border: 1px solid #394b68;
      border-radius: 10px;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      opacity: 0.8;
      cursor: default;
    }

    #ready {
      background: linear-gradient(135deg, #65416e, #ad527d);
      border-color: #d29aba;
      color: white;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 0 24px #bd62952b;
      animation: readyAppear 0.8s ease both;
    }

    [hidden] {
      display: none !important;
    }

    .hint {
      margin: 17px 0 0;
      text-align: center;
      color: #75839a;
      font-family: Arial, sans-serif;
      font-size: 12px;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes readyAppear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="screen">

    <div class="status" id="status">
      <span class="dot"></span> A LITTLE MESSAGE FOR YOU...
    </div>

    <div id="output"></div><span class="cursor" id="cursor"></span>

    <button id="start">
      ▶ Start the Surprise
    </button>

    <button id="ready" hidden>
       I'm Ready.
    </button>

    <p class="hint" id="hint">
      𝙰 𝚕𝚒𝚝𝚝𝚕𝚎 𝚖𝚎𝚜𝚜𝚊𝚐𝚎 𝚓𝚞𝚜𝚝 𝚏𝚘𝚛 𝚢𝚘𝚞.
    </p>

  </main>

  <script>
    // ❤️ YOUR MESSAGE
    const message = `Hey Gracy...𖹭

There's something I've been wanting to tell you...

Sometimes, even when we're miles apart, someone can still feel closer than anyone else. 

And I hope you know that you're one of those people to me.

Anyway, I have a little something for you today...

But first,
are you ready? `;

    const output = document.getElementById("output");
    const status = document.getElementById("status");
    const startButton = document.getElementById("start");
    const readyButton = document.getElementById("ready");
    const cursor = document.getElementById("cursor");
    const hint = document.getElementById("hint");

    let audioContext = null;
    let noiseBuffer = null;
    let started = false;

    // Create soft, code-generated laptop key sounds.
    function prepareAudio() {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) return;

      audioContext = new AudioContextClass();

      const length = Math.floor(
        audioContext.sampleRate * 0.05
      );

      noiseBuffer = audioContext.createBuffer(
        1,
        length,
        audioContext.sampleRate
      );

      const data = noiseBuffer.getChannelData(0);

      for (let i = 0; i < length; i++) {
        const fade = Math.pow(1 - i / length, 2);
        data[i] = (Math.random() * 2 - 1) * fade;
      }
    }

    // Play one subtle, lower-pitch key press.
    function keySound(char) {
      if (!audioContext || !noiseBuffer) return;

      const now = audioContext.currentTime;
      const isSpace = char === " ";
      const isPunctuation = /[.,!?]/.test(char);

      const source = audioContext.createBufferSource();
      source.buffer = noiseBuffer;

      const filter = audioContext.createBiquadFilter();
      filter.type = "lowpass";
      // Lowered filter frequencies for a deeper sound
      filter.frequency.value = isSpace
        ? 800
        : 1200 + Math.random() * 600;
      filter.Q.value = 0.55;

      const gain = audioContext.createGain();

      const volume = isSpace ? 0.008 : isPunctuation ? 0.012 : 0.006 + Math.random() * 0.005;

      gain.gain.setValueAtTime(0.001, now);

      gain.gain.exponentialRampToValueAtTime(
        volume,
        now + 0.002
      );

      gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.025 + Math.random() * 0.018
      );

      source.connect(filter);
      filter.connect(gain);
      gain.connect(audioContext.destination);

      source.start(now);
      source.stop(now + 0.05);

      // Add a lower occasional body thump sound.
      if (!isSpace && Math.random() < 0.12) {
        const oscillator = audioContext.createOscillator();
        const bodyGain = audioContext.createGain();

        oscillator.type = "sine";
        // Lowered oscillator frequency range
        oscillator.frequency.value =
          80 + Math.random() * 50;

        bodyGain.gain.setValueAtTime(0.006, now);

        bodyGain.gain.exponentialRampToValueAtTime(
          0.001,
          now + 0.018
        );

        oscillator.connect(bodyGain);
        bodyGain.connect(audioContext.destination);

        oscillator.start(now);
        oscillator.stop(now + 0.02);
      }
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Automatically type the message with smooth auto-scrolling.
    async function typeMessage() {
      for (let i = 0; i < message.length; i++) {
        const char = message[i];

        output.textContent += char;

        // Smooth scroll window down as text expands
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: 'smooth'
        });

        if (char !== "\n") {
          keySound(char);
        }

        let delay;

        if (char === "\n") {
          delay = 400 + Math.random() * 250;
        } else if (/[.!?]/.test(char)) {
          delay = 450 + Math.random() * 300;
        } else if (char === ",") {
          delay = 220 + Math.random() * 140;
        } else if (char === " ") {
          delay = 85 + Math.random() * 65;
        } else {
          delay = 45 + Math.random() * 45;
        }

        // Occasional pauses for a natural typing rhythm.
        if (/[a-z]/i.test(char) && Math.random() < 0.035) {
          delay += 180 + Math.random() * 250;
        }

        await wait(delay);
      }

      // Typing has finished.
      status.innerHTML =
        '<span class="dot"></span> MESSAGE COMPLETE';

      cursor.style.display = "none";

      // Keep the original button visible.
      startButton.disabled = true;
      startButton.textContent = "✓ Message Complete";

      // Reveal the next button.
      readyButton.hidden = false;

      hint.textContent = "️𝚃𝚑𝚎 𝚋𝚎𝚜𝚝 𝚙𝚊𝚛𝚝 𝚒𝚜 𝚢𝚎𝚝 𝚝𝚘 𝚌𝚘𝚖𝚎...𖹭";
    }

    // Start typing after the first tap.
    startButton.addEventListener("click", async () => {
      if (started) return;

      started = true;
      startButton.disabled = true;
      startButton.textContent = "Typing... ️";

      status.innerHTML =
        '<span class="dot"></span> MESSAGE IN PROGRESS...';

      try {
        prepareAudio();

        if (
          audioContext &&
          audioContext.state === "suspended"
        ) {
          await audioContext.resume();
        }
      } catch (error) {
        console.warn("Audio unavailable:", error);
      }

      typeMessage();
    });

    // Open the next page.
    readyButton.addEventListener("click", () => {
      window.location.href = "surprise.html";
    });
  </script>

</body>
</html>
